<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Only - UEE Mathematics CBT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
    overflow-x:hidden;
}

body{
    font-family:'Inter',sans-serif;
    background:#f3f4f6;
    overflow-y:auto;
    margin:0;
    font-size:clamp(14px, 1.5vw, 16px);
}
/* ================= HOME PAGE ================= */

#menu-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
    background:linear-gradient(135deg,#111827,#1e3a8a);
    overflow:hidden;
}

.hero-card{
    width:min(450px, 100%);
    background:white;
    border-radius:24px;
    padding:clamp(16px, 4vw, 25px);
    box-sizing:border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

.hero-top{
text-align:center;
margin-bottom:20px;
}

.hero-top img{
width:min(80vw,300px);   /* wider logo */
height:auto;
display:block;
margin:auto;
}

.hero-title{
font-size:clamp(28px,7vw,48px);
font-weight:800;
text-align:center;
margin-bottom:18px;
color:#111827;
}

.hero-sub{
    color:#6b7280;
    font-size:15px;
    line-height:1.6;
    margin-bottom:25px;
}

.exam-box{
background:#f9fafb;
padding:22px;
border-radius:18px;
border:1px solid #e5e7eb;
}

.exam-badge{
display:inline-block;
background:#dbeafe;
color:#2563eb;
padding:10px 16px;
border-radius:999px;
font-weight:700;
font-size:13px;
margin-bottom:15px;
}

.exam-name{
font-size:28px;
font-weight:800;
margin-bottom:12px;
}

.exam-desc{
color:#6b7280;
line-height:1.7;
margin-bottom:25px;
}

.exam-stats{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px;
width:100%;
}
@media(max-width:600px){
    .hero-card{
        width:95%;
        padding:18px;
    }
}

.stat{
    min-width:0;
    padding:15px 10px;
    text-align:center;
}
@media(max-width:600px){

.stat{
    padding:10px 5px;
}

.stat h3{
    font-size:28px;
}

.stat p{
    font-size:12px;
}

}

.stat h3{
font-size:28px;
color:#2563eb;
margin-bottom:5px;
}

.stat p{
font-size:14px;
font-weight:700;
}

.start-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(37,99,235,.35);
}

/* ================= EXAM PAGE ================= */

#exam-page{
    display:none;
    min-height:100vh;
    background:#f5f7fb;
    overflow-y:auto;
}

.topbar{
height:70px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:clamp(20px,4vw,36px);
font-weight:800;
color:#2563eb;
}

.timer{
background:#fee2e2;
color:#dc2626;
padding:10px 18px;
border-radius:12px;
font-weight:800;
}

.exam-layout{
display:grid;
grid-template-columns:1fr 260px;
gap:15px;
padding:15px;
min-height:calc(100vh - 70px);
height:auto;
box-sizing:border-box;
}
@media(max-width:600px){

    .exam-stats{
        grid-template-columns:1fr;
    }

}

@media(max-width:900px){

    .exam-layout{
        display:flex;
        flex-direction:column;
    }

    .question-card{
        order:1;
    }

    .exam-stats{
    grid-template-columns:1fr;
}

    .side-panel{
        order:2;
        margin-top:15px;
    }

}

.question-card{
    background:white;
    padding: 16px;
    border-radius:20px;
    border:1px solid #e5e7eb;
    min-height:500px;
}

.q-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.q-number{
background:#eff6ff;
color:#2563eb;
padding:8px 14px;
border-radius:999px;
font-weight:700;
font-size: 14px;
}

.flag-btn{
color:#dc2626;
font-weight:700;
cursor:pointer;
}

.question{
 font-size: clamp(14px, 4vw, 15px);
    line-height:1.6;
    font-weight:500;
    color:#111827;
    margin-bottom:18px;
}
.instruction{
    font-weight: 400;
}

.options{
display:flex;
flex-direction:column;
gap:16px;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 14px;
    border:2px solid #e5e7eb;
    border-radius:14px;
    font-size:15px;
}
.option:hover{
border-color:#2563eb;
background:#eff6ff;
}

.option input{
transform:scale(1.3);
}

.side-panel{
background:white;
padding:12px;
border-radius:14px;
border:1px solid #e5e7eb;
}

.summary{
padding:8px;
border-radius:8px;
font-weight:600;
font-size:13px;
margin-bottom:6px;
text-align:center;
}

.answered{
background:#dcfce7;
color:#15803d;
}

.remaining{
background:#fef3c7;
color:#b45309;
}

.flagged{
background:#fee2e2;
color:#dc2626;
}

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    margin-top:15px;
}

.question-card{
height:100%;
}

body{
font-size:16px;
}

.hero-title{
font-size:clamp(28px, 5vw, 42px);
}

.instruction,
.question,
.option{
    font-size: clamp(14px, 4vw, 15px);
    line-height: 1.6;
}

.grid button{
    width:40px;
    height:40px;
    font-size:12px;
    border:none;
    border-radius:8px;
    font-weight:700;
}

.nav-buttons{
display:flex;
gap:15px;
margin-top:35px;
}

.nav-btn{
flex:1;
padding:16px;
border:none;
border-radius:14px;
font-weight:800;
cursor:pointer;
font-size:16px;
}

.prev{
background:#d1d5db;
}

.next{
background:#2563eb;
color:white;
}

/* ================= RESULT PAGE ================= */

#result-page{
display:none;
padding:50px 20px;
background:#f5f7fb;
min-height:100vh;
}

.result-card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:10px;
    border-radius:14px;
}

.result-title{
font-size:32px;
font-weight:800;
line-height: 1.2;
margin-bottom:15px;
text-align:center;
}

.score{
font-size:48px;
line-height: 1.1;
font-weight:800;
color:#2563eb;
text-align:center;
margin-bottom:35px;
}

.review-item{
    background:#f9fafb;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    border-left:4px solid #2563eb;
    line-height:1.2;
    font-size:12px;
}

.correct{
color:#16a34a;
font-weight:800;
}

.wrong{
color:#dc2626;
font-weight:800;
}

.back-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:15px;
font-weight:800;
cursor:pointer;
margin-top:25px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

.hero-title{
font-size:34px;
}

.exam-layout{
grid-template-columns:1fr;
}

.side-panel{
position:relative;
top:0;
}

.question-card{
padding:22px;
}

.question{
font-size:20px;
}

.nav-buttons{
flex-direction:column;
}

.grid{
grid-template-columns:repeat(5,1fr);
}

}
@media (max-width: 600px){

    #menu-page{
        padding:12px;
        align-items:center;
    }

    .hero-card{
        width:100%;
        max-width:360px;
        padding:18px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.15);
    }

    .hero-top img{
        width:70px;
        margin-bottom:10px;
    }

    .hero-title{
        font-size:26px;
        margin-bottom:6px;
    }

    .hero-sub{
        font-size:13px;
        margin-bottom:18px;
    }

    .exam-stats{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:6px;
        margin-top:10px;
    }

    .stat{
        padding:10px 5px;
    }

    .stat h3{
        font-size:20px;
    }

    .stat p{
        font-size:11px;
    }

    .start-btn{
        margin-top:18px;
        padding:14px;
        font-size:15px;
        border-radius:12px;
    }

    .question-image{
width:350px;
max-width:100%;
display:block;
margin:15px auto;
}
@media (max-width: 600px) {
    body {
        font-size: 18px;
    }

    .question {
        font-size: 22px;
    }

    .option {
        font-size: 18px;
    }

    .q-number {
        font-size: 14px;
    }

    .timer {
        font-size: 18px;
    }
}
.question {
    font-size: clamp(18px, 5vw, 24px);
}

.option {
    font-size: clamp(16px, 4vw, 20px);
}
.option-image{
    width:150px;
    max-width:100%;
    display:block;
    margin-top:10px;
    border-radius:8px;
}

.question-image{
    width:350px;
    max-width:100%;
    display:block;
    margin:15px auto;
}
@media (max-width:600px){

    .question{
        font-size:17px;
        line-height:1.6;
    }

    .option{
        font-size:15px;
        padding:10px 12px;
    }

    .option input{
        transform:scale(1.1);
        margin-top:3px;
    }

}
/* ================= RESULT PAGE MOBILE ================= */

@media (max-width:600px){

#result-page{
    padding:20px 12px;
}

.result-card{
    padding:18px;
    border-radius:18px;
}

.result-title{
    font-size:24px;
    margin-bottom:10px;
}

.score{
    font-size:42px;
    margin-bottom:12px;
}

.score span{
    font-size:20px !important;
}

.review-item{
    padding:12px;
    border-radius:14px;
    font-size:14px;
    line-height:1.5;
}

.review-item h3{
    font-size:16px;
    margin-bottom:10px;
}

.correct,
.wrong{
    font-size:15px;
}

.back-btn{
    padding:12px;
    font-size:15px;
}

}


</style>

</head>

<body>

<!-- HOME PAGE -->

<div id="menu-page">

<div class="hero-card">

<div class="hero-top">
    <img src="logo.jpg" alt="Practice Only Logo">
</div>

<button class="start-btn" onclick="selectSubject('math')">
📘 Mathematics
</button>



<button class="start-btn" onclick="selectSubject('chemistry')">
🧪 Chemistry
</button>



<button class="start-btn" onclick="selectSubject('history')">
📜 History
</button>


<button class="start-btn" onclick="selectSubject('geography')">
🌍 Geography
</button>

<button class="start-btn" onclick="selectSubject('economics')">
📊 Economics
</button>

<button class="start-btn" onclick="selectSubject('English')">
📖 English
</button>

<button class="start-btn" onclick="selectSubject('SAT')">
💡 SAT
</button>

<button class="start-btn" onclick="selectSubject('Physics')">
,🚀 Physics
</button>

<button class="start-btn" onclick="selectSubject('Biology')">
🧬 Biology
</button>

</div>

</div>

</div>

<!-- EXAM PAGE -->

<div id="exam-page">

<div class="topbar">

<div class="logo">
Mathematics
</div>

<div class="timer" id="timer">
03:00:00
</div>

</div>

<div class="exam-layout">

<div class="question-card">

<div class="q-head">

<div class="q-number" id="question-number">
Question 1
</div>

<div class="flag-btn" id="flag-btn" onclick="toggleFlag()">
🚩 Flag
</div>

</div>

<div id="instruction" class="instruction"></div>

<div class="question" id="question-text"></div>

<div class="options" id="options-container"></div>

<div class="nav-buttons">

<button class="nav-btn prev" onclick="prevQuestion()">
Previous
</button>

<button class="nav-btn next" onclick="nextQuestion()">
Next
</button>

</div>

</div>

<div class="side-panel">

<div class="summary answered">
Answered:
<span id="answered-count">0</span>
</div>

<div class="summary remaining">
Remaining:
<span id="remaining-count">60</span>
</div>

<div class="summary flagged">
Flagged:
<span id="flagged-count">0</span>
</div>

<div class="grid" id="grid"></div>

<button class="start-btn" onclick="submitExam()">
Submit Exam
</button>

</div>

</div>

</div>




<!-- RESULT PAGE -->

<div id="result-page">

<div class="result-card">

<h1 class="result-title">
Exam Completed
</h1>

<div class="score" id="score"></div>

<div id="review"></div>

<button class="back-btn" onclick="location.reload()">
Return Home
</button>

</div>

</div>
<script src="data/maths.js"></script>
<script src="data/chemistry.js"></script>
<script src="data/history.js"></script>
<script src="data/geography.js"></script>

<script src="script.js"></script>

<script>



let questions=[];

function selectSubject(subject){

    if(subject==="math"){
questions = mathQuestions;
time = 10800; // 3h
document.querySelector(".logo").innerText="Mathematics";
}
    if(subject==="chemistry"){
questions = chemistryQuestions;
time = 9000; // 2h 30m
document.querySelector(".logo").innerText="Chemistry";
}
    if(subject==="history"){
questions = historyQuestions;
time = 7200; // 2h
document.querySelector(".logo").innerText="History";
}
  if(subject==="geography"){
questions = geographyQuestions;
time = 7200; // 2h
document.querySelector(".logo").innerText="geography";
}
    answers = Array(questions.length).fill(null);
    flags = Array(questions.length).fill(false);

    startExam();
}

function showQuestion(index){

const q = questions[index];

questionContainer.innerHTML = `
<h2>Question ${index+1}</h2>

<p>${q.question}</p>

${q.image ? `<img src="${q.image}" class="question-image">` : ""}

<div class="options">
${q.options.map(opt =>
`<button>${opt}</button>`
).join("")}
</div>
`;

}


let current=0;

let answers=[];

let flags=[];

let time=10800;

function startExam(){

document.getElementById("menu-page").style.display="none";
document.getElementById("exam-page").style.display="block";

renderQuestion();
startTimer();

}

function renderQuestion(){

    const q = questions[current];

    document.getElementById("question-number").innerText =
    `Question ${current+1} of ${questions.length}`;

    const questionText =
    document.getElementById("question-text");

    questionText.innerHTML = `
        <p>${q.question}</p>
        ${q.image ?
        `<img src="${q.image}" class="question-image">`
        : ""}
    `;

    const container =
    document.getElementById("options-container");

    container.innerHTML = "";

    q.options.forEach((opt,index)=>{

        const optionText =
        typeof opt === "string"
        ? opt
        : (opt.text || "");

        const optionImage =
        typeof opt === "object" && opt.image
        ? `<img src="${opt.image}" class="option-image">`
        : "";

        container.innerHTML += `

        <label class="option">

            <input
                type="radio"
                name="option"
                ${answers[current]===index ? "checked" : ""}
                onclick="selectAnswer(${index})"
            >

            <div>

                <b>${String.fromCharCode(65+index)}.</b>

                ${optionText}

                ${optionImage}

            </div>

        </label>

        `;
    });

    renderGrid();
    updateSummary();
    renderFlagButton();
  const instructionDiv = document.getElementById("instruction");

let instruction = "";

for (let i = current; i >= 0; i--) {
    if (questions[i].instruction) {
        instruction = questions[i].instruction;
        break;
    }
}

instructionDiv.innerHTML = instruction
    ? `<strong>${instruction}</strong>`
    : "";
}

function selectAnswer(index){

answers[current]=index;

renderGrid();
updateSummary();

}

function nextQuestion(){

if(current<questions.length-1){

current++;
renderQuestion();

}

}

function prevQuestion(){

if(current>0){

current--;
renderQuestion();

}

}

function toggleFlag() {
    flags[current] = !flags[current];

    renderFlagButton();
    renderGrid();
    updateSummary();
}
function renderFlagButton() {
    const btn = document.getElementById("flag-btn");

    if (flags[current]) {
        btn.textContent = "🚩 Unflag";
    } else {
        btn.textContent = "🚩 Flag";
    }

}

function renderGrid(){

const grid=document.getElementById("grid");

grid.innerHTML='';

questions.forEach((q,i)=>{

const btn=document.createElement("button");

btn.innerText=i+1;

if(i===current){

btn.style.background="#111827";
btn.style.color="white";

}

else if(flags[i]){

btn.style.background="#dc2626";
btn.style.color="white";

}

else if(answers[i]!==null){

btn.style.background="#16a34a";
btn.style.color="white";

}

else{

btn.style.background="#d1d5db";
btn.style.color="#111827";

}

btn.onclick=()=>{

current=i;
renderQuestion();

};

grid.appendChild(btn);

});

}

function updateSummary(){

document.getElementById("answered-count").innerText=
answers.filter(a=>a!==null).length;

document.getElementById("remaining-count").innerText=
answers.filter(a=>a===null).length;

document.getElementById("flagged-count").innerText=
flags.filter(f=>f).length;

}

function submitExam(){

document.getElementById("exam-page").style.display="none";

document.getElementById("result-page").style.display="block";

let score=0;

let review="";

answers.forEach((a,i)=>{

let correct=questions[i].ans;

if(a===correct){
score++;
}

if(a!==correct){

review += `
<div class="review-item">

<h3 style="margin-bottom:10px;font-size:18px;">
❌ Question ${i+1}
</h3>

<div style="font-size:15px;line-height:1.6;">

Your Answer:

<span class="wrong">
${
a!==null
? questions[i].options[a]
: "Not Answered"
}
</span>

<br><br>

Correct Answer:

<span class="correct">
${questions[i].options[correct]}
</span>

</div>

</div>
`;

}

});

let percent=Math.round(
(score/questions.length)*100
);

document.getElementById("score").innerHTML=`
${score}/${questions.length}

<br>

<span style="
font-size:28px;
color:#2563eb;
">

${percent}%

</span>

<br>

<div style="
font-size:18px;
margin-top:10px;
">

Correct:
${score}

<br>

Missed:
${questions.length-score}

</div>
`;

if(review===""){
review=`
<div class="review-item">
🎉 Perfect score
</div>
`;
}

document.getElementById("review").innerHTML=review;

}

</script>

</body>
</html>
