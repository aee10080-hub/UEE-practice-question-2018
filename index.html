
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Only - UEE Mathematics CBT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
    overflow-x:hidden;
}

body{
    font-family:'Inter',sans-serif;
    background:#f3f4f6;
    overflow-y:auto;
    margin:0;
    font-size:clamp(14px, 1.5vw, 16px);
}
/* ================= HOME PAGE ================= */

#menu-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
    background:linear-gradient(135deg,#111827,#1e3a8a);
    overflow:hidden;
}

.hero-card{
    width:min(450px, 100%);
    background:white;
    border-radius:24px;
    padding:clamp(16px, 4vw, 25px);
    box-sizing:border-box;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

.hero-top{
text-align:center;
margin-bottom:20px;
}

.hero-top img{
width:min(25vw,100px);
height:auto;
}

.hero-title{
font-size:clamp(28px,7vw,48px);
font-weight:800;
text-align:center;
margin-bottom:18px;
color:#111827;
}

.hero-sub{
    color:#6b7280;
    font-size:15px;
    line-height:1.6;
    margin-bottom:25px;
}

.exam-box{
background:#f9fafb;
padding:22px;
border-radius:18px;
border:1px solid #e5e7eb;
}

.exam-badge{
display:inline-block;
background:#dbeafe;
color:#2563eb;
padding:10px 16px;
border-radius:999px;
font-weight:700;
font-size:13px;
margin-bottom:15px;
}

.exam-name{
font-size:28px;
font-weight:800;
margin-bottom:12px;
}

.exam-desc{
color:#6b7280;
line-height:1.7;
margin-bottom:25px;
}

.exam-stats{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px;
width:100%;
}
@media(max-width:600px){
    .hero-card{
        width:95%;
        padding:18px;
    }
}

.stat{
    min-width:0;
    padding:15px 10px;
    text-align:center;
}
@media(max-width:600px){

.stat{
    padding:10px 5px;
}

.stat h3{
    font-size:28px;
}

.stat p{
    font-size:12px;
}

}

.stat h3{
font-size:28px;
color:#2563eb;
margin-bottom:5px;
}

.stat p{
font-size:14px;
font-weight:700;
}

.start-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(37,99,235,.35);
}

/* ================= EXAM PAGE ================= */

#exam-page{
    display:none;
    min-height:100vh;
    background:#f5f7fb;
    overflow-y:auto;
}

.topbar{
height:70px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:800;
color:#2563eb;
}

.timer{
background:#fee2e2;
color:#dc2626;
padding:10px 18px;
border-radius:12px;
font-weight:800;
}

.exam-layout{
display:grid;
grid-template-columns:1fr 260px;
gap:15px;
padding:15px;
min-height:calc(100vh - 70px);
height:auto;
box-sizing:border-box;
}
@media(max-width:600px){

    .exam-stats{
        grid-template-columns:1fr;
    }

}

@media(max-width:900px){

    .exam-layout{
        display:flex;
        flex-direction:column;
    }

    .question-card{
        order:1;
    }

    .exam-stats{
    grid-template-columns:1fr;
}

    .side-panel{
        order:2;
        margin-top:15px;
    }

}

.question-card{
    background:white;
    padding:20px;
    border-radius:20px;
    border:1px solid #e5e7eb;
    min-height:500px;
}

.q-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.q-number{
background:#eff6ff;
color:#2563eb;
padding:10px 18px;
border-radius:999px;
font-weight:700;
}

.flag-btn{
color:#dc2626;
font-weight:700;
cursor:pointer;
}

.question{
font-size:18px;
line-height:1.4;
margin-bottom:15px;
}

.options{
display:flex;
flex-direction:column;
gap:16px;
}

.option{
display:flex;
align-items:center;
gap:15px;
padding:10px;
border:2px solid #e5e7eb;
border-radius:16px;
cursor:pointer;
transition:0.25s;
}

.option:hover{
border-color:#2563eb;
background:#eff6ff;
}

.option input{
transform:scale(1.3);
}

.side-panel{
background:white;
padding:12px;
border-radius:14px;
border:1px solid #e5e7eb;
}

.summary{
padding:8px;
border-radius:8px;
font-weight:600;
font-size:13px;
margin-bottom:6px;
text-align:center;
}

.answered{
background:#dcfce7;
color:#15803d;
}

.remaining{
background:#fef3c7;
color:#b45309;
}

.flagged{
background:#fee2e2;
color:#dc2626;
}

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    margin-top:15px;
}

.question-card{
height:100%;
}

body{
font-size:16px;
}

.hero-title{
font-size:clamp(28px, 5vw, 42px);
}

.question{
font-size:clamp(16px, 2.5vw, 20px);
}

.grid button{
    width:40px;
    height:40px;
    font-size:12px;
    border:none;
    border-radius:8px;
    font-weight:700;
}

.nav-buttons{
display:flex;
gap:15px;
margin-top:35px;
}

.nav-btn{
flex:1;
padding:16px;
border:none;
border-radius:14px;
font-weight:800;
cursor:pointer;
font-size:16px;
}

.prev{
background:#d1d5db;
}

.next{
background:#2563eb;
color:white;
}

/* ================= RESULT PAGE ================= */

#result-page{
display:none;
padding:50px 20px;
background:#f5f7fb;
min-height:100vh;
}

.result-card{
max-width:1000px;
margin:auto;
background:white;
padding:40px;
border-radius:25px;
}

.result-title{
font-size:50px;
font-weight:800;
margin-bottom:15px;
text-align:center;
}

.score{
font-size:70px;
font-weight:800;
color:#2563eb;
text-align:center;
margin-bottom:35px;
}

.review-item{
background:#f9fafb;
padding:22px;
border-radius:18px;
margin-bottom:18px;
border-left:6px solid #2563eb;
line-height:1.8;
}

.correct{
color:#16a34a;
font-weight:800;
}

.wrong{
color:#dc2626;
font-weight:800;
}

.back-btn{
width:100%;
padding:18px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:800;
cursor:pointer;
margin-top:25px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

.hero-title{
font-size:34px;
}

.exam-layout{
grid-template-columns:1fr;
}

.side-panel{
position:relative;
top:0;
}

.question-card{
padding:22px;
}

.question{
font-size:20px;
}

.nav-buttons{

}

.grid{
grid-template-columns:repeat(5,1fr);
}

}

</style>

</head>

</button>

</div>

</div>

<div class="nav-buttons">

</div>

<div class="side-panel">

</div>

</div>

</h1>

<div class="score" id="score"></div>

<div id="review"></div>

<button class="back-btn" onclick="location.reload()">
Return Home
</button>

</div>

</div>

options:["P×R×T","PRT/100","P+R+T","P-R-T"],

options:["124","132","144","156"],
ans:2
}

let current=0;

let answers=Array(questions.length).fill(null);

let flags=Array(questions.length).fill(false);

let time=10800;

function startExam(){

document.getElementById("menu-page").style.display="none";
document.getElementById("exam-page").style.display="block";

renderQuestion();
startTimer();

}

function renderQuestion(){

const q=questions[current];

document.getElementById("question-number").innerText=
`Question ${current+1} of ${questions.length}`;

document.getElementById("question-text").innerText=q.question;

const container=document.getElementById("options-container");

container.innerHTML='';

q.options.forEach((opt,index)=>{

container.innerHTML += `

<label class="option">

<input
type="radio"
name="option"
${answers[current]===index?'checked':''}
onclick="selectAnswer(${index})"
>

<div>
<b>${String.fromCharCode(65+index)}.</b>
${opt}
</div>

</label>

`;

});

renderGrid();
updateSummary();

}

function selectAnswer(index){

answers[current]=index;

renderGrid();
updateSummary();

}

function nextQuestion(){

if(current<questions.length-1){

current++;
renderQuestion();

}

}

function prevQuestion(){

if(current>0){

current--;
renderQuestion();

}

}

function toggleFlag(){

flags[current]=!flags[current];

renderGrid();
updateSummary();

}

function renderGrid(){

const grid=document.getElementById("grid");

grid.innerHTML='';

questions.forEach((q,i)=>{

const btn=document.createElement("button");

btn.innerText=i+1;

if(i===current){

btn.style.background="#111827";
btn.style.color="white";

}

else if(flags[i]){

btn.style.background="#dc2626";
btn.style.color="white";

}

else if(answers[i]!==null){

btn.style.background="#16a34a";
btn.style.color="white";

}

else{

btn.style.background="#d1d5db";
btn.style.color="#111827";

}

btn.onclick=()=>{

current=i;
renderQuestion();

};

grid.appendChild(btn);

});

}

function updateSummary(){

document.getElementById("answered-count").innerText=
answers.filter(a=>a!==null).length;

document.getElementById("remaining-count").innerText=
answers.filter(a=>a===null).length;

document.getElementById("flagged-count").innerText=
flags.filter(f=>f).length;

}

function startTimer(){

const interval=setInterval(()=>{

time--;

let hrs=Math.floor(time/3600);
let mins=Math.floor((time%3600)/60);
let secs=time%60;

document.getElementById("timer").innerText=
`${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

if(time<=0){

clearInterval(interval);
submitExam();

}

},1000);

}


function submitExam(){

document.getElementById("exam-page").style.display="none";

document.getElementById("result-page").style.display="block";

let score=0;

let review='';

answers.forEach((a,i)=>{

if(a===questions[i].ans){

score++;

}

/* EXPLANATIONS */

let explanation="";

if(a!==questions[i].ans){

switch(i){

case 0:
explanation="2³ means 2 × 2 × 2 = 8.";
break;

case 1:
explanation="Like terms are added together. 3x + 2x = 5x.";
break;

case 2:
explanation="9 × 9 = 81, therefore √81 = 9.";
break;

case 3:
explanation="x² - 25 = 0 becomes x² = 25, so x = ±5.";
break;

case 4:
explanation="In y = mx + b, the slope is m. Therefore slope = 3.";
break;

default:
explanation="Review this question carefully and practice similar examples.";
}

}

/* REVIEW CARD */

review += `

<div class="review-item">

<b>Question ${i+1}</b>

<br><br>

Your Answer:

<span class="${a===questions[i].ans?'correct':'wrong'}">

${a!==null ? questions[i].options[a] : 'Not Answered'}

</span>

${
a!==questions[i].ans
?

`<div style="
margin-top:18px;
padding:15px;
background:#fef2f2;
border-left:5px solid #dc2626;
border-radius:10px;
line-height:1.7;
">

<b style="color:#dc2626;">
Explanation:
</b>

<br>

${explanation}

</div>`

:

`<div style="
margin-top:18px;
padding:15px;
background:#dcfce7;
border-left:5px solid #16a34a;
border-radius:10px;
line-height:1.7;
color:#166534;
font-weight:700;
">

Correct ✅

</div>`

}

</div>

`;

});

let percent=Math.round((score/questions.length)*100);

document.getElementById("score").innerHTML=

`${score}/${questions.length}

<br>

<span style="font-size:28px;">
${percent}%
</span>`;

document.getElementById("review").innerHTML=review;

}


</script>

</body>
</html>
